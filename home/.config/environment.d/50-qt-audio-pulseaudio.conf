# Qt 6.11 Multimedia domyślnie monitoruje urządzenia audio przez PipeWire (wątek PWDevMon).
# Gdy wyjście dźwięku znika (HDMI <-> głośniki, restart PipeWire, podłączenie TV),
# klient PipeWire w Qt wywraca proces — tu: plasmashell z tapetą wideo
# (Smart Video Wallpaper Reborn) i ekran blokady. Backend PulseAudio jest odporny.
# Dodane 10.10.2026. Usunięcie pliku = powrót do domyślnego (po ponownym zalogowaniu).
QT_AUDIO_BACKEND=pulseaudio

# DSP dla wbudowanych głośników (Dell Latitude 7430, ALC289).
#
# Działa jako "smart filter" WirePlumbera: nie jest osobnym wyjściem do
# wybierania, tylko wpina się automatycznie przed sink analogowy.
# Skrypt ~/.local/share/wireplumber/scripts/laptop-speakers-dsp.lua wyłącza
# filtr, gdy aktywne są słuchawki. HDMI to inny sink, więc filtr go nie dotyczy.
#
# Uwaga: wtyczki LSP przyjmują progi i wzmocnienia LINIOWO (1.0 = 0 dB),
# a nie w dB. Przeliczenie: 10^(dB/20).

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Głośniki laptopa (DSP)"
            media.name       = "Głośniki laptopa (DSP)"
            filter.graph = {
                nodes = [
                    # Psychoakustyczny bas (jak MaxxBass w Windows): z basu 30–180 Hz,
                    # którego głośniki nie zagrają, robi harmoniczne 2. i 3. rzędu,
                    # które zagrają — ucho "dopowiada" sobie podstawę.
                    # Na żywo: `dsp-ab bas` przełącza bypass.
                    {
                        type   = lv2
                        name   = bass
                        plugin = "https://chadmed.au/bankstown"
                        control = {
                            bypass     = 0.0
                            amt        = 3.5
                            floor      = 30.0
                            ceil       = 200.0
                            final_hp   = 100.0
                            sat_second = 2.0
                            sat_third  = 3.0
                            blend      = 0.6
                        }
                    }

                    # Odcięcie basu, którego te głośniki i tak nie zagrają
                    # (LR4 @ 110 Hz). Bez tego bas tylko zjada zapas głośności
                    # i powoduje zniekształcenia.
                    { type = builtin name = hp1_l label = bq_highpass control = { "Freq" = 110.0 "Q" = 0.707 } }
                    { type = builtin name = hp2_l label = bq_highpass control = { "Freq" = 110.0 "Q" = 0.707 } }
                    { type = builtin name = hp1_r label = bq_highpass control = { "Freq" = 110.0 "Q" = 0.707 } }
                    { type = builtin name = hp2_r label = bq_highpass control = { "Freq" = 110.0 "Q" = 0.707 } }

                    # Barwa. Preamp robi się półką przy 0 Hz (jak w przykładach PipeWire).
                    {
                        type   = builtin
                        name   = eq
                        label  = param_eq
                        config = {
                            filters = [
                                { type = bq_highshelf, freq = 0,    q = 1.0, gain = -8.0 }  # preamp (zapas na bas)
                                { type = bq_peaking,   freq = 250,  q = 0.8, gain =  2.5 }  # "ciało" średnicy, głos mniej płaski
                                { type = bq_peaking,   freq = 500,  q = 1.2, gain = -1.0 }  # lekko mniej "pudełkowo"
                                { type = bq_peaking,   freq = 3000, q = 1.5, gain =  1.5 }  # czytelność głosu
                                { type = bq_highshelf, freq = 10000, q = 0.7, gain =  1.5 }  # trochę powietrza; więcej = syczenie
                            ]
                        }
                    }

                    # Poszerzenie stereo (M/S, szerokość 1.6):
                    # L' = 1.3 L - 0.3 R, R' = 1.3 R - 0.3 L
                    { type = builtin name = wide_l label = mixer control = { "Gain 1" = 1.3 "Gain 2" = -0.3 } }
                    { type = builtin name = wide_r label = mixer control = { "Gain 1" = 1.3 "Gain 2" = -0.3 } }

                    # Podniesienie głośności cichych fragmentów (jak MaxxVolume), łagodnie,
                    # żeby nie spłaszczać dynamiki: próg -18 dB, 2:1, makeup +5 dB.
                    {
                        type   = lv2
                        name   = comp
                        plugin = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
                        control = {
                            al = 0.126    # próg -18 dB
                            cr = 2.0
                            at = 20.0     # ms
                            rt = 300.0    # ms (dłużej = mniej pompowania)
                            kn = 0.5      # kolano -6 dB
                            mk = 1.78     # makeup +5 dB
                        }
                    }

                    # Ochrona przed przesterem, sufit -1 dBFS.
                    {
                        type   = lv2
                        name   = limiter
                        plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = {
                            th = 0.89     # -1 dB
                            alr = 0.0     # bez automatycznej regulacji poziomu (dawała ściszanie)
                            lk = 5.0
                            at = 5.0
                            rt = 20.0
                        }
                    }
                ]
                links = [
                    { output = "bass:out_l" input = "hp1_l:In" }
                    { output = "bass:out_r" input = "hp1_r:In" }
                    { output = "hp1_l:Out" input = "hp2_l:In" }
                    { output = "hp1_r:Out" input = "hp2_r:In" }
                    { output = "hp2_l:Out" input = "eq:In 1" }
                    { output = "hp2_r:Out" input = "eq:In 2" }
                    { output = "eq:Out 1"  input = "wide_l:In 1" }
                    { output = "eq:Out 2"  input = "wide_l:In 2" }
                    { output = "eq:Out 2"  input = "wide_r:In 1" }
                    { output = "eq:Out 1"  input = "wide_r:In 2" }
                    { output = "wide_l:Out" input = "comp:in_l" }
                    { output = "wide_r:Out" input = "comp:in_r" }
                    { output = "comp:out_l" input = "limiter:in_l" }
                    { output = "comp:out_r" input = "limiter:in_r" }
                ]
                inputs  = [ "bass:in_l" "bass:in_r" ]
                outputs = [ "limiter:out_l" "limiter:out_r" ]
            }
            capture.props = {
                node.name         = "effect_input.laptop_speakers"
                media.class       = Audio/Sink
                audio.channels    = 2
                audio.position    = [ FL FR ]
                filter.smart      = true
                filter.smart.name = "laptop-speakers"
                filter.smart.target = { node.name = "alsa_output.pci-0000_00_1f.3.analog-stereo" }
            }
            playback.props = {
                node.name         = "effect_output.laptop_speakers"
                node.passive      = true
                stream.dont-remix = true
                audio.channels    = 2
                audio.position    = [ FL FR ]
            }
        }
    }
]
